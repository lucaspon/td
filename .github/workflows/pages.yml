name: Publish homepage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - website/**
      - assets/demo.gif
      - .github/workflows/pages.yml

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage public files
        run: |
          mkdir -p _site/assets
          cp index.html _site/
          cp -R website _site/website
          cp assets/demo.gif _site/assets/

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
